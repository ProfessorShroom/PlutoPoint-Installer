name: Build and Release Installer

on:
  push:
    tags:
      - 'v*.*.*.*' # Matches v7.0.0.0
      - '*.*.*.*'  # Matches 7.0.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Installer
        run: dotnet build "PlutoPoint Installer.csproj" --configuration Release

      - name: Stage Executable
        shell: powershell
        run: |
          # Search for the generated executable anywhere under the bin folder
          $exe = Get-ChildItem -Path "bin" -Filter "Computer Repair Centre Installer.exe" -Recurse | Select-Object -First 1

          if ($exe) {
              Write-Host "Found executable at: $($exe.FullName)"
              # Ensure output staging directory exists
              New-Item -ItemType Directory -Force -Path "staging"
              # Copy and rename to match the update.xml format
              Copy-Item -Path $exe.FullName -Destination "staging\Computer-Repair-Centre-Installer.exe" -Force
          } else {
              Write-Error "Could not find 'Computer Repair Centre Installer.exe' in bin directory."
              exit 1
          }

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/Computer-Repair-Centre-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Floating Latest Pointer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: "Latest Installer Build"
          files: staging/Computer-Repair-Centre-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
