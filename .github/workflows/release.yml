name: Build and Release Installer

on:
  push:
    tags:
      - 'v*.*.*.*'
      - '[0-9]*.*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/launcher-') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Detect Channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ b[0-9]+$ ]]; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches AssemblyInfo.cs
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          INFO=$(sed -n 's/.*AssemblyInformationalVersion("\([^"]*\)").*/\1/p' Properties/AssemblyInfo.cs)
          FILE=$(sed -n 's/.*AssemblyFileVersion("\([^"]*\)").*/\1/p' Properties/AssemblyInfo.cs)
          if [[ "$TAG" != "$INFO" || "${TAG%%b*}" != "$FILE" ]]; then
            echo "::error::Tag $TAG doesn't match AssemblyInfo.cs ($INFO / $FILE)"
            exit 1
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          # Use this version's "## <version>" section of CHANGELOG.md (or CHANGELOG-BETA.md) as the notes,
          # or GitHub's generated notes if there isn't one
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            /^## / { if (on) exit; h = substr($0, 4); sub(/ - .*/, "", h); if (h == v) { on = 1; next } }
            on
          ' CHANGELOG.md CHANGELOG-BETA.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            cat release-notes.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## ${VERSION}' section in CHANGELOG.md, using generated notes"
          fi

      - name: Check for a newer stable version
        id: newest
        if: ${{ steps.channel.outputs.beta != 'true' }}
        shell: bash
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NEWEST=$(git ls-remote --tags --refs origin \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v?[0-9]{1,3}(\.[0-9]+){3}$' \
            | sed 's/^v//' | sort -V | tail -n 1)
          if [[ "$VERSION" == "$NEWEST" ]]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${VERSION} is older than ${NEWEST}, so the stable download won't be replaced"
          fi

      - name: Build Installer
        run: dotnet build "PlutoPoint Installer.csproj" --configuration Release

      - name: Stage Executable
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "bin" -Filter "Computer Repair Centre Installer.exe" -Recurse | Select-Object -First 1
          if ($exe) {
              Write-Host "Found executable at: $($exe.FullName)"
              New-Item -ItemType Directory -Force -Path "staging"
              Copy-Item -Path $exe.FullName -Destination "staging\Computer-Repair-Centre-Installer.exe" -Force
          } else {
              Write-Error "Could not find 'Computer Repair Centre Installer.exe' in bin directory."
              exit 1
          }

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          name: "Computer Repair Centre Installer ${{ github.ref_name }}${{ steps.channel.outputs.beta == 'true' && ' Beta' || '' }}"
          files: staging/Computer-Repair-Centre-Installer.exe
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ steps.channel.outputs.beta == 'true' }}
          make_latest: ${{ steps.newest.outputs.newest == 'true' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Floating Latest Pointer
        if: ${{ steps.newest.outputs.newest == 'true' }}
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: installer-latest
          name: "Computer Repair Centre Installer Latest"
          files: staging/Computer-Repair-Centre-Installer.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}