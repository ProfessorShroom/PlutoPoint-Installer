name: Build and Release Installer

on:
  push:
    tags:
      - "v*.*.*.*"
      - "*.*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish Installer
        run: |
          dotnet publish "PlutoPoint Installer.csproj" --configuration Release --output staging
          Rename-Item -Path "staging\Computer Repair Centre Installer.exe" -NewName "Computer-Repair-Centre-Installer.exe"

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          name: "Computer Repair Centre Installer ${{ github.ref_name }}"
          files: staging/Computer-Repair-Centre-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Floating Latest Pointer
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: installer-latest
          name: "Computer Repair Centre Installer Latest"
          files: staging/Computer-Repair-Centre-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
