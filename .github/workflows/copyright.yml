name: Update Copyright Year

on:
  schedule:
    - cron: '0 2 1 1 *'
  workflow_dispatch:

jobs:
  update-copyright:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update copyright year in README.md, LICENSE.md, and C# files
        run: |
          START_YEAR=2016
          CURRENT_YEAR=$(date +%Y)

          # Single year in the first year, a range after that
          if [ "$CURRENT_YEAR" = "$START_YEAR" ]; then
            RANGE="$START_YEAR"
          else
            RANGE="$START_YEAR-$CURRENT_YEAR"
          fi

          # 1. README.md: handles single year or ranges and strips any trailing period
          sed -i -E "s/Copyright © Charlie Howard $START_YEAR(-[0-9]{4})?\.?/Copyright © Charlie Howard $RANGE/g" README.md

          # 2. LICENSE.md: handles the copyright year format in your license file
          if [ -f "LICENSE.md" ]; then
            sed -i -E "s/Copyright © Charlie Howard $START_YEAR(-[0-9]{4})?\.?/Copyright © Charlie Howard $RANGE/g" LICENSE.md
          fi

          # 3. C# source files: updates // Copyright ... header comments
          find . -type f -name "*.cs" \
            -not -path "./.git/*" \
            -exec sed -i -E "s#//\s*Copyright © Charlie Howard $START_YEAR(-[0-9]{4})? All rights reserved\.?#// Copyright © Charlie Howard $RANGE All rights reserved#g" {} +

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -u
          # Only commit if changes were actually made
          git diff --staged --quiet || (git commit -m "Update copyright year range to $START_YEAR-$(date +%Y)" && git push)