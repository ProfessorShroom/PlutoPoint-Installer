name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "PlutoPoint Installer.csproj"

      - name: Build (Debug)
        run: dotnet build "PlutoPoint Installer.csproj" --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build "PlutoPoint Installer.csproj" --configuration Release --no-restore
