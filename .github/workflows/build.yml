name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "PlutoPoint Installer.csproj" -r win-x64

      - name: Build (Debug)
        run: dotnet build "PlutoPoint Installer.csproj" --configuration Debug --no-restore -r win-x64

      - name: Build (Release)
        run: dotnet build "PlutoPoint Installer.csproj" --configuration Release --no-restore -r win-x64
