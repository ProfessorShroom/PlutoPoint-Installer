name: Build and Release Launcher

on:
  push:
    tags:
      - 'launcher-v*.*.*.*'
      - 'launcher-*.*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Read Version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#launcher-}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Stable Launcher
        run: dotnet build "Launcher/PlutoPointLauncher.csproj" --configuration Release -p:Channel=Stable -p:PublishDir="${{ github.workspace }}/publish/Stable/"

      - name: Build Beta Launcher
        run: dotnet build "Launcher/PlutoPointLauncher.csproj" --configuration Release -p:Channel=Beta -p:PublishDir="${{ github.workspace }}/publish/Beta/"

      - name: Stage Executables
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "staging"

          $exeStable = "publish/Stable/PlutoPointLauncher.exe"
          if (-not (Test-Path $exeStable)) {
              Write-Error "Could not find $exeStable."
              exit 1
          }
          Copy-Item -Path $exeStable -Destination "staging\Computer.Repair.Centre.Launcher.exe" -Force

          $exeBeta = "publish/Beta/PlutoPointLauncherBeta.exe"
          if (-not (Test-Path $exeBeta)) {
              Write-Error "Could not find $exeBeta."
              exit 1
          }
          Copy-Item -Path $exeBeta -Destination "staging\Computer.Repair.Centre.Launcher.Beta.exe" -Force

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          name: "Computer Repair Centre Launcher ${{ steps.version.outputs.version }}"
          files: |
            staging/Computer.Repair.Centre.Launcher.exe
            staging/Computer.Repair.Centre.Launcher.Beta.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Floating Latest Pointer
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: launcher-latest
          name: "Computer Repair Centre Launcher Latest"
          files: |
            staging/Computer.Repair.Centre.Launcher.exe
            staging/Computer.Repair.Centre.Launcher.Beta.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      version: ${{ steps.version.outputs.version }}

  update-feeds:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set launcher version in update feeds
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version '$VERSION'"
            exit 1
          fi
          sed -i -E "s#<version>[^<]*</version>#<version>$VERSION</version>#" update.xml updateBeta.xml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add update.xml updateBeta.xml
          git diff --staged --quiet && exit 0
          git commit -m "Launcher v${{ needs.build.outputs.version }}"
          git push origin main